<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MarketFeed Engine Pro - All-India Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-400">⚡ MarketFeed Pro (India)</h1>
    <div class="flex gap-2">
      <button onclick="saveToCloud()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded text-xs font-semibold">☁️ Cloud Save</button>
      <button onclick="loadCurrentView()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-semibold">🔄 Refresh Feed</button>
    </div>
  </header>

  <div class="flex flex-1 flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-1/3 bg-slate-800/50 p-4 border-r border-slate-700 space-y-6">
      
      <!-- Create Feed or Bundle -->
      <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-2">
        <h2 class="text-xs font-bold text-green-400 uppercase tracking-wider">+ Create Feed / Bundle</h2>
        <select id="itemType" onchange="toggleFormMode()" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-white">
          <option value="feed">Single Keyword Feed (All Indian Outlets)</option>
          <option value="bundle">Feed Bundle (Group Feeds)</option>
        </select>
        <input id="itemName" type="text" placeholder="Name (e.g., KPIT, VBL, Sugar)" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-white">
        
        <div id="queryContainer">
          <input id="itemQuery" type="text" placeholder="Search Keywords or RSS URL" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-white">
        </div>

        <div id="bundleSelectContainer" class="hidden">
          <p class="text-[10px] text-slate-400 mb-1">Select Feeds to include in this Bundle:</p>
          <div id="bundleCheckboxes" class="max-h-24 overflow-y-auto space-y-1 bg-slate-900 p-2 rounded text-xs border border-slate-700"></div>
        </div>

        <button onclick="createItem()" class="w-full bg-green-600 hover:bg-green-500 text-white py-1.5 rounded text-xs font-bold">Save Feed / Bundle</button>
      </div>

      <!-- Advanced Filter Rules Editor -->
      <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-blue-400 uppercase tracking-wider">⚙️ Active Filters</h2>
          <span id="editingTargetLabel" class="text-[10px] text-slate-400 font-mono">None Selected</span>
        </div>
        
        <!-- Whitelist -->
        <div>
          <label class="text-[11px] font-semibold text-slate-300">Whitelist Keywords (Comma separated)</label>
          <input id="ruleWhitelist" type="text" placeholder="Must contain..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-white mt-1">
          <div class="flex gap-3 mt-1 text-[10px] text-slate-400">
            <label><input type="checkbox" id="wlTitle" checked> Title</label>
            <label><input type="checkbox" id="wlDesc" checked> Description</label>
            <label><input type="checkbox" id="wlLink"> Link</label>
          </div>
        </div>

        <!-- Blacklist -->
        <div>
          <label class="text-[11px] font-semibold text-slate-300">Blacklist Keywords (Comma separated)</label>
          <input id="ruleBlacklist" type="text" placeholder="Hide if contains..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-white mt-1">
          <div class="flex gap-3 mt-1 text-[10px] text-slate-400">
            <label><input type="checkbox" id="blTitle" checked> Title</label>
            <label><input type="checkbox" id="blDesc" checked> Description</label>
            <label><input type="checkbox" id="blLink"> Link</label>
          </div>
        </div>

        <!-- Auto-Hide Conditions -->
        <div>
          <label class="text-[11px] font-semibold text-slate-300 mb-1 block">Auto-Hide Conditions</label>
          <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-300">
            <label><input type="checkbox" id="hideNoDesc"> No description</label>
            <label><input type="checkbox" id="hideNoDates"> No dates</label>
            <label><input type="checkbox" id="hideNoSecure"> No secure links</label>
            <label><input type="checkbox" id="hideDupTitles" checked> Duplicate titles</label>
            <label><input type="checkbox" id="hideDupDesc"> Duplicate desc</label>
            <label><input type="checkbox" id="hideSimilar" checked> Hide similar titles</label>
          </div>
        </div>

        <!-- Title Cleaning & Time Filter -->
        <div class="space-y-2 pt-2 border-t border-slate-700">
          <label class="flex items-center gap-2 text-[11px] text-slate-300">
            <input type="checkbox" id="cleanTitle" checked>
            <span><b>Clean Title</b> (Remove publisher suffix)</span>
          </label>

          <div class="flex items-center gap-2 text-[11px]">
            <span class="text-slate-300">Auto-hide older than:</span>
            <input id="maxAgeHours" type="number" value="168" class="w-12 bg-slate-900 border border-slate-700 p-1 rounded text-white text-center">
            <span class="text-slate-400">Hours</span>
          </div>
        </div>

        <button onclick="saveActiveRules()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-1 rounded text-xs font-bold">Apply Rules to Selection</button>
      </div>

      <!-- Cloud Config -->
      <div>
        <h2 class="text-xs font-bold text-slate-400 uppercase mb-1">☁️ Cloud Sync (GitHub Gist)</h2>
        <input id="githubToken" type="password" placeholder="GitHub Token" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-white mb-1">
        <input id="gistId" type="text" placeholder="Gist ID" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-white mb-2">
        <button onclick="syncFromCloud()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-1 rounded text-xs">Load Cloud Config</button>
      </div>

      <!-- Lists -->
      <div class="space-y-4">
        <div>
          <h2 class="text-xs font-bold text-slate-400 uppercase mb-2">📰 My Saved Feeds</h2>
          <div id="feedList" class="space-y-1"></div>
        </div>
        <div>
          <h2 class="text-xs font-bold text-slate-400 uppercase mb-2">📦 My Saved Bundles</h2>
          <div id="bundleList" class="space-y-1"></div>
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 id="currentTitle" class="text-2xl font-bold">Select a Feed or Bundle</h2>
          <p id="currentMeta" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <span id="articleCount" class="text-slate-400 text-sm">0 articles</span>
      </div>
      <div id="newsContainer" class="grid grid-cols-1 gap-4"></div>
    </main>
  </div>

  <script>
    const defaultRules = () => ({
      wl: '', wlTitle: true, wlDesc: true, wlLink: false,
      bl: '', blTitle: true, blDesc: true, blLink: false,
      hideNoDesc: false, hideNoDates: false, hideNoSecure: false,
      hideDupTitles: true, hideDupDesc: false, hideSimilar: true,
      cleanTitle: true, maxAgeHours: 168
    });

    let feeds = JSON.parse(localStorage.getItem('mp_feeds_v3')) || [
      { id: 'f1', name: 'Infosys', query: 'Infosys', rules: defaultRules() },
      { id: 'f2', name: 'KPIT Tech', query: 'KPIT Technologies', rules: defaultRules() }
    ];
    let bundles = JSON.parse(localStorage.getItem('mp_bundles_v3')) || [
      { id: 'b1', name: 'IT Stocks', feedIds: ['f1', 'f2'], rules: defaultRules() }
    ];
    let blockedDomains = JSON.parse(localStorage.getItem('mp_blocked_domains')) || [];
    let pinnedArticles = JSON.parse(localStorage.getItem('mp_pinned')) || [];
    
    let activeSelection = { type: 'feed', id: 'f1' };

    function saveState() {
      localStorage.setItem('mp_feeds_v3', JSON.stringify(feeds));
      localStorage.setItem('mp_bundles_v3', JSON.stringify(bundles));
      localStorage.setItem('mp_blocked_domains', JSON.stringify(blockedDomains));
      localStorage.setItem('mp_pinned', JSON.stringify(pinnedArticles));
      renderSidebar();
    }

    function toggleFormMode() {
      const mode = document.getElementById('itemType').value;
      document.getElementById('queryContainer').classList.toggle('hidden', mode === 'bundle');
      document.getElementById('bundleSelectContainer').classList.toggle('hidden', mode === 'feed');
    }

    function renderSidebar() {
      const fList = document.getElementById('feedList');
      const bList = document.getElementById('bundleList');
      const checkboxes = document.getElementById('bundleCheckboxes');
      
      fList.innerHTML = '';
      bList.innerHTML = '';
      checkboxes.innerHTML = '';

      feeds.forEach(f => {
        const isSelected = activeSelection.type === 'feed' && activeSelection.id === f.id;
        fList.innerHTML += `
          <div class="flex justify-between items-center p-2 rounded cursor-pointer ${isSelected ? 'bg-blue-600 text-white' : 'hover:bg-slate-700 text-slate-300'}">
            <span onclick="selectItem('feed', '${f.id}')" class="font-medium text-xs">📰 ${f.name}</span>
            <button onclick="deleteItem('feed', '${f.id}')" class="text-red-400 text-xs font-bold px-1">✕</button>
          </div>`;

        checkboxes.innerHTML += `
          <label class="flex items-center gap-2">
            <input type="checkbox" value="${f.id}" class="bundle-feed-check">
            <span>${f.name}</span>
          </label>`;
      });

      bundles.forEach(b => {
        const isSelected = activeSelection.type === 'bundle' && activeSelection.id === b.id;
        bList.innerHTML += `
          <div class="flex justify-between items-center p-2 rounded cursor-pointer ${isSelected ? 'bg-indigo-600 text-white' : 'hover:bg-slate-700 text-slate-300'}">
            <span onclick="selectItem('bundle', '${b.id}')" class="font-medium text-xs">📦 ${b.name} (${b.feedIds.length} feeds)</span>
            <button onclick="deleteItem('bundle', '${b.id}')" class="text-red-400 text-xs font-bold px-1">✕</button>
          </div>`;
      });
    }

    function createItem() {
      const type = document.getElementById('itemType').value;
      const name = document.getElementById('itemName').value.trim();
      if (!name) return alert('Enter a name');

      const id = 'id_' + Date.now();
      if (type === 'feed') {
        const query = document.getElementById('itemQuery').value.trim();
        if (!query) return alert('Enter search keyword or RSS URL');
        feeds.push({ id, name, query, rules: defaultRules() });
      } else {
        const selectedFeedIds = Array.from(document.querySelectorAll('.bundle-feed-check:checked')).map(cb => cb.value);
        if (!selectedFeedIds.length) return alert('Select at least one feed for this bundle');
        bundles.push({ id, name, feedIds: selectedFeedIds, rules: defaultRules() });
      }

      saveState();
      selectItem(type, id);
    }

    function deleteItem(type, id) {
      if (type === 'feed') {
        feeds = feeds.filter(f => f.id !== id);
        bundles.forEach(b => b.feedIds = b.feedIds.filter(fId => fId !== id));
      } else {
        bundles = bundles.filter(b => b.id !== id);
      }
      activeSelection = { type: null, id: null };
      saveState();
      clearDisplay();
    }

    function selectItem(type, id) {
      activeSelection = { type, id };
      renderSidebar();
      loadActiveRulesIntoUI();
      loadCurrentView();
    }

    function getActiveObject() {
      if (activeSelection.type === 'feed') return feeds.find(f => f.id === activeSelection.id);
      if (activeSelection.type === 'bundle') return bundles.find(b => b.id === activeSelection.id);
      return null;
    }

    function loadActiveRulesIntoUI() {
      const obj = getActiveObject();
      if (!obj) return;
      document.getElementById('editingTargetLabel').innerText = `${activeSelection.type.toUpperCase()}: ${obj.name}`;
      
      const r = obj.rules || defaultRules();
      document.getElementById('ruleWhitelist').value = r.wl || '';
      document.getElementById('wlTitle').checked = r.wlTitle;
      document.getElementById('wlDesc').checked = r.wlDesc;
      document.getElementById('wlLink').checked = r.wlLink;

      document.getElementById('ruleBlacklist').value = r.bl || '';
      document.getElementById('blTitle').checked = r.blTitle;
      document.getElementById('blDesc').checked = r.blDesc;
      document.getElementById('blLink').checked = r.blLink;

      document.getElementById('hideNoDesc').checked = r.hideNoDesc;
      document.getElementById('hideNoDates').checked = r.hideNoDates;
      document.getElementById('hideNoSecure').checked = r.hideNoSecure;
      document.getElementById('hideDupTitles').checked = r.hideDupTitles;
      document.getElementById('hideDupDesc').checked = r.hideDupDesc;
      document.getElementById('hideSimilar').checked = r.hideSimilar;
      document.getElementById('cleanTitle').checked = r.cleanTitle;
      document.getElementById('maxAgeHours').value = r.maxAgeHours;
    }

    function saveActiveRules() {
      const obj = getActiveObject();
      if (!obj) return alert('Select a feed or bundle first.');

      obj.rules = {
        wl: document.getElementById('ruleWhitelist').value,
        wlTitle: document.getElementById('wlTitle').checked,
        wlDesc: document.getElementById('wlDesc').checked,
        wlLink: document.getElementById('wlLink').checked,

        bl: document.getElementById('ruleBlacklist').value,
        blTitle: document.getElementById('blTitle').checked,
        blDesc: document.getElementById('blDesc').checked,
        blLink: document.getElementById('blLink').checked,

        hideNoDesc: document.getElementById('hideNoDesc').checked,
        hideNoDates: document.getElementById('hideNoDates').checked,
        hideNoSecure: document.getElementById('hideNoSecure').checked,
        hideDupTitles: document.getElementById('hideDupTitles').checked,
        hideDupDesc: document.getElementById('hideDupDesc').checked,
        hideSimilar: document.getElementById('hideSimilar').checked,
        cleanTitle: document.getElementById('cleanTitle').checked,
        maxAgeHours: parseFloat(document.getElementById('maxAgeHours').value) || 0
      };

      saveState();
      loadCurrentView();
    }

    // Proxy Fetch Engine with Fallbacks for Yahoo, Google, and Indian Media Outlets
    async function fetchRssViaProxies(url, sourceLabel) {
      // Proxy 1: Feed2Json
      try {
        const res = await fetch(`https://feed2json.org/convert?url=${encodeURIComponent(url)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.items && data.items.length > 0) {
            return data.items.map(i => ({
              title: i.title || '',
              link: i.url || i.external_url || '',
              description: i.summary || i.content_html || '',
              pubDate: i.date_published || '',
              source: sourceLabel
            }));
          }
        }
      } catch (e) {}

      // Proxy 2: RSS2JSON
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=50`);
        if (res.ok) {
          const data = await res.json();
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            return data.items.map(i => ({
              title: i.title || '',
              link: i.link || i.guid || '',
              description: i.description || i.content || '',
              pubDate: i.pubDate || '',
              source: sourceLabel
            }));
          }
        }
      } catch (e) {}

      // Proxy 3: Allorigins CORS Bypass Direct XML Parser
      try {
        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        if (res.ok) {
          const xmlText = await res.text();
          const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");
          const items = Array.from(xmlDoc.querySelectorAll("item"));
          if (items.length > 0) {
            return items.map(i => ({
              title: i.querySelector("title")?.textContent || '',
              link: i.querySelector("link")?.textContent || i.querySelector("guid")?.textContent || '',
              description: i.querySelector("description")?.textContent || '',
              pubDate: i.querySelector("pubDate")?.textContent || '',
              source: sourceLabel
            }));
          }
        }
      } catch (e) {}

      return [];
    }

    async function fetchRawFeedArticles(query) {
      const isUrl = query.startsWith('http://') || query.startsWith('https://');
      
      if (isUrl) {
        return await fetchRssViaProxies(query, 'Direct Feed');
      }

      const encodedQuery = encodeURIComponent(query);

      // Targeted multi-engine endpoints targeting Indian financial platforms
      const sources = [
        { name: 'Google News (General)', url: `https://news.google.com/rss/search?q=${encodedQuery}&hl=en-IN&gl=IN&ceid=IN:en` },
        { name: 'Yahoo News', url: `https://news.search.yahoo.com/rss?p=${encodedQuery}` },
        { name: 'Bing News', url: `https://www.bing.com/news/search?q=${encodedQuery}&format=RSS` },
        { name: 'Moneycontrol (Indexed)', url: `https://news.google.com/rss/search?q=${encodedQuery}+site:moneycontrol.com&hl=en-IN&gl=IN&ceid=IN:en` },
        { name: 'Economic Times (Indexed)', url: `https://news.google.com/rss/search?q=${encodedQuery}+site:economictimes.indiatimes.com&hl=en-IN&gl=IN&ceid=IN:en` },
        { name: 'Livemint (Indexed)', url: `https://news.google.com/rss/search?q=${encodedQuery}+site:livemint.com&hl=en-IN&gl=IN&ceid=IN:en` }
      ];

      const promises = sources.map(src => fetchRssViaProxies(src.url, src.name));
      const results = await Promise.all(promises);
      return results.flat();
    }

    function applyFilterRules(items, rules) {
      if (!rules) return items;

      const wlKeywords = (rules.wl || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      const blKeywords = (rules.bl || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);

      const seenTitles = new Set();
      const seenDescriptions = new Set();
      const normalizedTitles = [];

      return items.filter(item => {
        const title = (item.title || '').trim();
        const desc = (item.description || '').replace(/<[^>]*>?/gm, '').trim();
        const link = item.link || '';
        const domain = getDomain(link);

        if (blockedDomains.includes(domain)) return false;

        if (rules.hideNoDesc && !desc) return false;
        if (rules.hideNoDates && (!item.pubDate || isNaN(new Date(item.pubDate).getTime()))) return false;
        if (rules.hideNoSecure && link && !link.startsWith('https://')) return false;

        if (rules.maxAgeHours > 0 && item.pubDate && !isNaN(new Date(item.pubDate).getTime())) {
          const ageInHours = (new Date() - new Date(item.pubDate)) / (1000 * 60 * 60);
          if (ageInHours > rules.maxAgeHours) return false;
        }

        if (wlKeywords.length > 0) {
          const targets = [];
          if (rules.wlTitle) targets.push(title.toLowerCase());
          if (rules.wlDesc) targets.push(desc.toLowerCase());
          if (rules.wlLink) targets.push(link.toLowerCase());
          if (!wlKeywords.some(kw => targets.some(t => t.includes(kw)))) return false;
        }

        if (blKeywords.length > 0) {
          const targets = [];
          if (rules.blTitle) targets.push(title.toLowerCase());
          if (rules.blDesc) targets.push(desc.toLowerCase());
          if (rules.blLink) targets.push(link.toLowerCase());
          if (blKeywords.some(kw => targets.some(t => t.includes(kw)))) return false;
        }

        if (rules.hideDupTitles && title) {
          if (seenTitles.has(title.toLowerCase())) return false;
          seenTitles.add(title.toLowerCase());
        }

        if (rules.hideDupDesc && desc) {
          if (seenDescriptions.has(desc.toLowerCase())) return false;
          seenDescriptions.add(desc.toLowerCase());
        }

        if (rules.hideSimilar && title) {
          const cleanNorm = title.toLowerCase().replace(/[^a-z0-9]/g, '');
          const isSimilar = normalizedTitles.some(prev => {
            const minLen = Math.min(prev.length, cleanNorm.length);
            return minLen > 15 && (prev.includes(cleanNorm.slice(0, 20)) || cleanNorm.includes(prev.slice(0, 20)));
          });
          if (isSimilar) return false;
          normalizedTitles.push(cleanNorm);
        }

        return true;
      });
    }

    async function loadCurrentView() {
      const container = document.getElementById('newsContainer');
      const obj = getActiveObject();
      if (!obj) return clearDisplay();

      container.innerHTML = '<p class="text-slate-400">Fetching articles from Yahoo, Google, Bing, Moneycontrol, ET, and Livemint...</p>';

      let finalArticles = [];

      if (activeSelection.type === 'feed') {
        document.getElementById('currentTitle').innerText = `📰 ${obj.name}`;
        document.getElementById('currentMeta').innerText = `Keyword: "${obj.query}" (Google + Yahoo + Bing + MC + ET + Mint)`;
        
        const raw = await fetchRawFeedArticles(obj.query);
        finalArticles = applyFilterRules(raw, obj.rules);

      } else if (activeSelection.type === 'bundle') {
        document.getElementById('currentTitle').innerText = `📦 ${obj.name} [Bundle]`;
        document.getElementById('currentMeta').innerText = `Bundle includes ${obj.feedIds.length} feed(s).`;

        const feedPromises = obj.feedIds.map(async (fId) => {
          const feedObj = feeds.find(f => f.id === fId);
          if (!feedObj) return [];
          const raw = await fetchRawFeedArticles(feedObj.query);
          return applyFilterRules(raw, feedObj.rules);
        });

        const nestedArticles = await Promise.all(feedPromises);
        const mergedFeedArticles = nestedArticles.flat();
        
        finalArticles = applyFilterRules(mergedFeedArticles, obj.rules);
      }

      finalArticles.sort((a, b) => {
        const dateA = new Date(a.pubDate).getTime() || 0;
        const dateB = new Date(b.pubDate).getTime() || 0;
        return dateB - dateA;
      });

      document.getElementById('articleCount').innerText = `${finalArticles.length} articles`;

      if (!finalArticles.length) {
        container.innerHTML = '<p class="text-slate-400">No articles found matching these filter settings.</p>';
        return;
      }

      const activeRules = obj.rules || defaultRules();

      container.innerHTML = finalArticles.map(item => {
        let displayTitle = item.title;
        if (activeRules.cleanTitle) {
          displayTitle = displayTitle.replace(/\s*[-|–]\s*[^|-–]+$/, '');
        }

        const domain = getDomain(item.link);
        const isPinned = pinnedArticles.includes(item.link);
        const formattedDate = item.pubDate && !isNaN(new Date(item.pubDate).getTime()) ? new Date(item.pubDate).toLocaleString() : 'Recent';

        return `
          <div class="bg-slate-800 p-4 rounded-lg border ${isPinned ? 'border-yellow-500 bg-slate-800/80' : 'border-slate-700'} hover:border-blue-500 transition">
            <div class="flex justify-between items-start gap-2 mb-2">
              <h3 class="font-semibold text-base leading-snug">
                <a href="${item.link}" target="_blank" class="text-blue-300 hover:underline">${displayTitle}</a>
              </h3>
              ${isPinned ? '<span class="text-xs text-yellow-400">📌 Pinned</span>' : ''}
            </div>
            <p class="text-xs text-slate-400 mb-2">
              🏷️ Engine: <b class="text-blue-400">${item.source}</b> • 
              📰 Source: <b class="text-slate-200">${domain}</b> • 
              Published: ${formattedDate}
            </p>
            <p class="text-sm text-slate-300 line-clamp-2 mb-3">${(item.description || '').replace(/<[^>]*>?/gm, '')}</p>
            
            <div class="flex gap-2 pt-2 border-t border-slate-700/60 text-xs">
              <button onclick="blockDomain('${domain}')" class="bg-slate-700 hover:bg-red-900/40 text-red-300 px-2 py-1 rounded">🚫 Block ${domain}</button>
              <button onclick="togglePin('${item.link}')" class="bg-slate-700 hover:bg-yellow-900/40 text-yellow-300 px-2 py-1 rounded">${isPinned ? 'Unpin' : '📌 Pin Post'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getDomain(url) {
      try { 
        if (!url) return 'news-source';
        return new URL(url).hostname.replace('www.', ''); 
      } catch (e) { 
        return 'news-source'; 
      }
    }

    function blockDomain(domain) {
      if (confirm(`Block all future news from ${domain}?`)) {
        blockedDomains.push(domain);
        saveState();
        loadCurrentView();
      }
    }

    function togglePin(link) {
      if (pinnedArticles.includes(link)) pinnedArticles = pinnedArticles.filter(l => l !== link);
      else pinnedArticles.push(link);
      saveState();
      loadCurrentView();
    }

    function clearDisplay() {
      document.getElementById('currentTitle').innerText = 'Select or Create a Feed/Bundle';
      document.getElementById('newsContainer').innerHTML = '';
      document.getElementById('articleCount').innerText = '0 articles';
    }

    async function saveToCloud() {
      const token = document.getElementById('githubToken').value.trim();
      let gistId = document.getElementById('gistId').value.trim();
      if (!token) return alert('Enter a GitHub Personal Access Token.');

      const payload = {
        description: "MarketFeed Settings Storage",
        public: false,
        files: {
          "marketfeed_data_v3.json": {
            content: JSON.stringify({ feeds, bundles, blockedDomains, pinnedArticles }, null, 2)
          }
        }
      };

      const url = gistId ? `https://api.github.com/gists/${gistId}` : `https://api.github.com/gists`;
      const method = gistId ? 'PATCH' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.id) {
        document.getElementById('gistId').value = data.id;
        alert('Configuration saved to cloud gist successfully!');
      } else {
        alert('Error saving to cloud.');
      }
    }

    async function syncFromCloud() {
      const gistId = document.getElementById('gistId').value.trim();
      if (!gistId) return alert('Enter a valid Gist ID.');

      const res = await fetch(`https://api.github.com/gists/${gistId}`);
      const data = await res.json();
      if (data.files && data.files['marketfeed_data_v3.json']) {
        const cloudData = JSON.parse(data.files['marketfeed_data_v3.json'].content);
        feeds = cloudData.feeds || [];
        bundles = cloudData.bundles || [];
        blockedDomains = cloudData.blockedDomains || [];
        pinnedArticles = cloudData.pinnedArticles || [];
        saveState();
        if (feeds.length > 0) selectItem('feed', feeds[0].id);
        alert('Loaded settings from Cloud!');
      }
    }

    renderSidebar();
    if (feeds.length > 0) selectItem('feed', feeds[0].id);
  </script>
</body>
</html>
