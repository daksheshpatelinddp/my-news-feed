<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Market Feed Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-400">⚡ MarketFeed Generator</h1>
    <button onclick="refreshCurrentFeed()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-semibold transition">🔄 Refresh News</button>
  </header>

  <div class="flex flex-1 flex-col md:flex-row">
    <aside class="w-full md:w-1/4 bg-slate-800/50 p-4 border-r border-slate-700">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">+ Create Keyword Feed</h2>
      <div class="flex gap-2 mb-6">
        <input id="keywordInput" type="text" placeholder="Enter keyword (e.g. Reliance, TCS)" class="bg-slate-900 border border-slate-700 text-sm rounded px-3 py-2 w-full text-white focus:outline-none focus:border-blue-500">
        <button onclick="addFeed()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded text-sm font-bold">+</button>
      </div>

      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">My Saved Feeds</h2>
      <div id="feedList" class="space-y-1"></div>
    </aside>

    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 id="currentFeedTitle" class="text-2xl font-bold">Select or Add a Feed</h2>
        <span id="articleCount" class="text-slate-400 text-sm">0 articles</span>
      </div>
      <div id="newsContainer" class="grid grid-cols-1 gap-4"></div>
    </main>
  </div>

  <script>
    let feeds = JSON.parse(localStorage.getItem('my_rss_feeds')) || ['Reliance', 'TCS'];
    let activeFeed = feeds[0] || '';

    function saveFeeds() { localStorage.setItem('my_rss_feeds', JSON.stringify(feeds)); renderSidebar(); }

    function renderSidebar() {
      const list = document.getElementById('feedList');
      list.innerHTML = '';
      feeds.forEach(feed => {
        const btn = document.createElement('div');
        btn.className = `flex justify-between items-center p-2 rounded cursor-pointer ${feed === activeFeed ? 'bg-blue-600 text-white' : 'hover:bg-slate-700 text-slate-300'}`;
        btn.innerHTML = `<span onclick="selectFeed('${feed}')" class="font-medium">📈 ${feed}</span> <button onclick="deleteFeed('${feed}')" class="text-red-400 text-xs hover:text-red-300 font-bold px-2">✕</button>`;
        list.appendChild(btn);
      });
    }

    function addFeed() {
      const input = document.getElementById('keywordInput');
      const val = input.value.trim().replace(/[$#]/g, '');
      if (val && !feeds.includes(val)) {
        feeds.push(val);
        activeFeed = val;
        input.value = '';
        saveFeeds();
        loadNews(val);
      }
    }

    function deleteFeed(feed) {
      feeds = feeds.filter(f => f !== feed);
      if (activeFeed === feed) activeFeed = feeds[0] || '';
      saveFeeds();
      if (activeFeed) loadNews(activeFeed); else clearNews();
    }

    function selectFeed(feed) { activeFeed = feed; renderSidebar(); loadNews(feed); }

    async function loadNews(keyword) {
      document.getElementById('currentFeedTitle').innerText = `${keyword} News`;
      const container = document.getElementById('newsContainer');
      container.innerHTML = '<p class="text-slate-400">Fetching latest articles...</p>';
      
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(keyword)}&hl=en-IN&gl=IN&ceid=IN:en`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.status === 'ok' && data.items.length > 0) {
          document.getElementById('articleCount').innerText = `${data.items.length} articles`;
          container.innerHTML = data.items.map(item => `
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 hover:border-blue-500 transition">
              <h3 class="font-semibold text-lg mb-2"><a href="${item.link}" target="_blank" class="text-blue-300 hover:underline">${item.title}</a></h3>
              <p class="text-xs text-slate-400 mb-2">Published: ${new Date(item.pubDate).toLocaleString()}</p>
              <p class="text-sm text-slate-300 line-clamp-2">${item.description.replace(/<[^>]*>?/gm, '')}</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p class="text-slate-400">No articles found for this keyword.</p>';
        }
      } catch (e) {
        container.innerHTML = '<p class="text-red-400">Failed to fetch news stream. Please try again.</p>';
      }
    }

    function refreshCurrentFeed() { if (activeFeed) loadNews(activeFeed); }
    function clearNews() {
      document.getElementById('currentFeedTitle').innerText = 'No Feeds Available';
      document.getElementById('newsContainer').innerHTML = '';
      document.getElementById('articleCount').innerText = '0 articles';
    }

    renderSidebar();
    if (activeFeed) loadNews(activeFeed);
  </script>
</body>
</html>
